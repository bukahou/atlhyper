# AtlHyper Master API 规格（单一来源）
# 改接口先改这里，再在 atlhyper_web 下运行 npm run api:gen 重新生成前端类型（CI 会核对生成结果与规格一致）；
# Go 一侧的响应由各处理函数的契约测试对照本文件校验（api/contract）。
openapi: 3.0.3
info:
  title: AtlHyper Master API
  version: 2.0.0
  description: Master 对 Web 的 HTTP 接口（逐步迁入：新写与改到的接口先进规格）。前端类型由本文件生成；Go 响应由契约测试对照本文件校验。
paths:
  /api/v2/overview:
    get:
      operationId: getClusterOverview
      summary: 集群概览
      x-permission: cluster.read
      parameters:
      - $ref: '#/components/parameters/ClusterId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterOverview'
        '400':
          description: 缺少或错误的参数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 集群不存在或暂无数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v2/events:
    get:
      operationId: listEvents
      summary: 事件列表（实时或历史）
      x-permission: events.read
      parameters:
      - $ref: '#/components/parameters/ClusterId'
      - name: source
        in: query
        schema:
          type: string
          enum:
          - realtime
          - history
          default: realtime
        description: realtime 取内存里的当前事件；history 取数据库里的历史
      - name: type
        in: query
        schema:
          type: string
        description: 事件类型（Normal / Warning）
      - name: since
        in: query
        schema:
          type: string
          format: date-time
        description: 只取这之后的事件（RFC 3339）
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          default: 100
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '400':
          description: 缺少或错误的参数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v2/observe/metrics/nodes:
    get:
      operationId: listNodeMetrics
      summary: 各节点指标（每项带后端判定的等级）
      x-permission: metrics.read
      parameters:
      - $ref: '#/components/parameters/ClusterId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeMetricsListResponse'
        '400':
          description: 缺少或错误的参数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 数据尚未就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v2/observe/metrics/hardware:
    get:
      operationId: getHardwareHealth
      summary: 硬件健康矩阵（阈值判定在后端完成）
      x-permission: metrics.read
      parameters:
      - $ref: '#/components/parameters/ClusterId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardwareHealthEnvelope'
        '400':
          description: 缺少或错误的参数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 数据尚未就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  parameters:
    ClusterId:
      name: cluster_id
      in: query
      required: true
      schema:
        type: string
        minLength: 1
      description: 集群 ID
  schemas:
    ClusterOverview:
      additionalProperties: false
      description: 集群概览响应
      properties:
        alerts:
          $ref: '#/components/schemas/OverviewAlerts'
        cards:
          $ref: '#/components/schemas/OverviewCards'
        clusterId:
          type: string
        nodes:
          $ref: '#/components/schemas/OverviewNodes'
        workloads:
          $ref: '#/components/schemas/OverviewWorkloads'
      required:
      - alerts
      - cards
      - clusterId
      - nodes
      - workloads
      type: object
    CoolingDevice:
      additionalProperties: false
      description: 内核 thermal cooling device（node_cooling_device_{cur,max}_state）。 Type 取值来自内核：pwm-fan / Processor / intel_powerclamp / TCC Offset ...
      properties:
        curState:
          type: integer
        maxState:
          type: integer
        name:
          type: string
        type:
          type: string
      required:
      - curState
      - maxState
      - name
      - type
      type: object
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
      - error
      description: 错误响应
      properties:
        error:
          type: string
          description: 给人看的错误说明（程序判断看状态码，不看这段文字）
    ObserveFailureCode:
      type: string
      description: 观测查询（经 Agent 执行）失败的类别。界面按它出提示；Agent 的原始错误只进日志，⛔ 不返回给页面
      enum:
      - not_configured
      - invalid_params
      - timeout
      - unavailable
      - rejected
      - failed
    ObserveFailureResponse:
      type: object
      additionalProperties: false
      required:
      - error
      - code
      description: 观测查询失败的响应：通用说明 + 失败类别
      properties:
        error:
          type: string
          description: 通用说明（兜底；界面按 code 出提示）
        code:
          $ref: '#/components/schemas/ObserveFailureCode'
    EventCards:
      additionalProperties: false
      description: 事件统计卡片（随事件列表一起返回，前端不自己数）
      properties:
        categoriesCount:
          type: integer
        critical:
          type: integer
        error:
          type: integer
        info:
          type: integer
        kindsCount:
          type: integer
        totalAlerts:
          description: critical + warning + error
          type: integer
        totalEvents:
          type: integer
        warning:
          description: 不含 critical
          type: integer
      required:
      - categoriesCount
      - critical
      - error
      - info
      - kindsCount
      - totalAlerts
      - totalEvents
      - warning
      type: object
    EventListResponse:
      additionalProperties: false
      description: 事件列表响应
      properties:
        cards:
          allOf:
          - $ref: '#/components/schemas/EventCards'
          description: 本次返回的事件的统计
        events:
          items:
            $ref: '#/components/schemas/EventLog'
          type: array
        limit:
          type: integer
        offset:
          type: integer
        source:
          type: string
        total:
          type: integer
      required:
      - cards
      - events
      - source
      - total
      type: object
    EventLog:
      additionalProperties: false
      description: 事件日志项
      properties:
        category:
          type: string
        clusterId:
          type: string
        count:
          type: integer
          description: 发生次数
        eventTime:
          type: string
          description: 最近一次发生时间
        kind:
          type: string
        message:
          type: string
        name:
          type: string
        namespace:
          type: string
        node:
          type: string
          description: 事件来源主机（节点名）；上报方没有给出时为空
        reason:
          type: string
        severity:
          description: 后端判定的严重程度，前端只按它上色
          type: string
          enum:
          - critical
          - warning
          - error
          - info
        source:
          type: string
          description: 产生事件的组件（kubelet / default-scheduler …）
        time:
          type: string
          description: 首次发生时间
      required:
      - category
      - clusterId
      - count
      - eventTime
      - kind
      - message
      - name
      - namespace
      - node
      - reason
      - severity
      - source
      - time
      type: object
    FanSensor:
      additionalProperties: false
      description: hwmon 风扇转速（node_hwmon_fan_rpm）
      properties:
        chip:
          type: string
        rpm:
          format: double
          type: number
        sensor:
          type: string
      required:
      - chip
      - rpm
      - sensor
      type: object
    HardwareAwaitCell:
      additionalProperties: false
      description: 磁盘延迟格（该节点最差的块设备）
      properties:
        device:
          type: string
        status:
          enum:
          - good
          - warn
          - crit
          - unknown
          type: string
        valueMs:
          format: double
          type: number
      required:
      - device
      - status
      - valueMs
      type: object
    HardwareFanCell:
      additionalProperties: false
      description: 风扇格。RPM 为 nil = 没有转速传感器（只有 cooling state）。
      properties:
        maxState:
          type: integer
        rpm:
          format: double
          nullable: true
          type: number
        state:
          type: integer
        status:
          enum:
          - good
          - warn
          - crit
          - unknown
          type: string
      required:
      - maxState
      - rpm
      - state
      - status
      type: object
    HardwareFreqCell:
      additionalProperties: false
      description: CPU 频率格（热降频判定）
      properties:
        currentGHz:
          format: double
          type: number
        maxGHz:
          format: double
          type: number
        ratioPct:
          format: double
          type: number
        status:
          enum:
          - good
          - warn
          - crit
          - unknown
          type: string
      required:
      - currentGHz
      - maxGHz
      - ratioPct
      - status
      type: object
    HardwareHealthEnvelope:
      type: object
      additionalProperties: false
      required:
      - message
      - data
      properties:
        message:
          type: string
        data:
          $ref: '#/components/schemas/HardwareHealthResponse'
    HardwareHealthResponse:
      additionalProperties: false
      description: 硬件健康矩阵：每个节点一行，外加速览
      properties:
        rows:
          items:
            $ref: '#/components/schemas/HardwareRow'
          type: array
        summary:
          $ref: '#/components/schemas/HardwareSummary'
      required:
      - rows
      - summary
      type: object
    HardwareMaxAwait:
      additionalProperties: false
      description: 速览：集群最差磁盘延迟
      properties:
        device:
          type: string
        nodeName:
          type: string
        status:
          enum:
          - good
          - warn
          - crit
          - unknown
          type: string
        valueMs:
          format: double
          type: number
      required:
      - device
      - nodeName
      - status
      - valueMs
      type: object
    HardwareMaxTemp:
      additionalProperties: false
      description: 速览：集群最高温（含来源）
      properties:
        nodeName:
          type: string
        sensor:
          type: string
        status:
          enum:
          - good
          - warn
          - crit
          - unknown
          type: string
        value:
          format: double
          type: number
      required:
      - nodeName
      - sensor
      - status
      - value
      type: object
    HardwareRow:
      additionalProperties: false
      description: 矩阵一行 = 一个节点
      properties:
        cpuFreq:
          allOf:
          - $ref: '#/components/schemas/HardwareFreqCell'
          nullable: true
        cpuTemp:
          allOf:
          - $ref: '#/components/schemas/HardwareTempCell'
          nullable: true
        cpuUsage:
          allOf:
          - $ref: '#/components/schemas/HardwareUsageCell'
          nullable: true
        diskAwait:
          allOf:
          - $ref: '#/components/schemas/HardwareAwaitCell'
          nullable: true
        diskTemp:
          allOf:
          - $ref: '#/components/schemas/HardwareTempCell'
          nullable: true
        diskUsage:
          allOf:
          - $ref: '#/components/schemas/HardwareUsageCell'
          nullable: true
        fan:
          allOf:
          - $ref: '#/components/schemas/HardwareFanCell'
          nullable: true
        kernel:
          type: string
        memUsage:
          allOf:
          - $ref: '#/components/schemas/HardwareUsageCell'
          nullable: true
        nodeIP:
          type: string
        nodeName:
          type: string
        otherTemp:
          allOf:
          - $ref: '#/components/schemas/HardwareTempCell'
          nullable: true
        overall:
          enum:
          - good
          - warn
          - crit
          - unknown
          type: string
        profile:
          type: string
        profileLabel:
          type: string
        sensors:
          description: 全部温度传感器逐个判定，供节点详情的温度卡渲染；无传感器时为空数组
          items:
            $ref: '#/components/schemas/HardwareSensorCell'
          type: array
        undervolt:
          allOf:
          - $ref: '#/components/schemas/HardwareUndervoltCell'
          nullable: true
        uptime:
          description: 秒
          format: int64
          type: integer
      required:
      - cpuFreq
      - cpuTemp
      - cpuUsage
      - diskAwait
      - diskTemp
      - diskUsage
      - fan
      - memUsage
      - nodeName
      - otherTemp
      - overall
      - profile
      - profileLabel
      - sensors
      - undervolt
      type: object
    HardwareSensorCell:
      additionalProperties: false
      description: 单个温度传感器的判定结果（节点详情的温度卡用）。 与矩阵里的三个温度格不同：那三格是每类取最热的一个，这里是逐个列出。
      properties:
        class:
          type: string
          enum:
          - cpu
          - disk
          - other
        crit:
          format: double
          type: number
        label:
          description: chip 可读名（coretemp / nvme0 / rp1_adc）
          type: string
        max:
          format: double
          type: number
        sensor:
          description: temp1 / temp2 ...
          type: string
        status:
          enum:
          - good
          - warn
          - crit
          - unknown
          type: string
        value:
          format: double
          type: number
      required:
      - class
      - crit
      - label
      - max
      - sensor
      - status
      - value
      type: object
    HardwareSummary:
      additionalProperties: false
      description: 速览 tile 数据
      properties:
        maxDiskAwait:
          allOf:
          - $ref: '#/components/schemas/HardwareMaxAwait'
          nullable: true
        maxDiskTemp:
          allOf:
          - $ref: '#/components/schemas/HardwareMaxTemp'
          nullable: true
        maxTemp:
          allOf:
          - $ref: '#/components/schemas/HardwareMaxTemp'
          nullable: true
        throttledNodes:
          type: integer
        undervoltNodes:
          type: integer
        warningNodes:
          description: 整行结论（overall）为 warn / crit 的节点数
          type: integer
      required:
      - maxDiskAwait
      - maxDiskTemp
      - maxTemp
      - throttledNodes
      - undervoltNodes
      - warningNodes
      type: object
    HardwareTempCell:
      additionalProperties: false
      description: 温度格（CPU / 磁盘 / 其他）
      properties:
        crit:
          description: crit 阈值
          format: double
          type: number
        label:
          type: string
        max:
          description: warn 阈值（传感器自带或画像表）
          format: double
          type: number
        status:
          enum:
          - good
          - warn
          - crit
          - unknown
          type: string
        value:
          format: double
          type: number
      required:
      - crit
      - max
      - status
      - value
      type: object
    HardwareUndervoltCell:
      additionalProperties: false
      description: 欠压格（树莓派）
      properties:
        alarm:
          type: boolean
        status:
          enum:
          - good
          - warn
          - crit
          - unknown
          type: string
      required:
      - alarm
      - status
      type: object
    HardwareUsageCell:
      additionalProperties: false
      description: 资源使用率格（CPU / 内存 / 磁盘）
      properties:
        status:
          enum:
          - good
          - warn
          - crit
          - unknown
          type: string
        value:
          format: double
          type: number
      required:
      - status
      - value
      type: object
    NodeCPU:
      additionalProperties: false
      properties:
        cores:
          type: integer
        freqHz:
          description: 各核当前频率（node_cpu_scaling_frequency_hertz）
          items:
            format: double
            type: number
          type: array
        freqMaxHz:
          description: 标称最高频率（node_cpu_scaling_frequency_max_hertz）
          format: double
          type: number
        iowaitPct:
          format: double
          type: number
        load1:
          format: double
          type: number
        load15:
          format: double
          type: number
        load5:
          format: double
          type: number
        systemPct:
          format: double
          type: number
        usagePct:
          format: double
          type: number
        userPct:
          format: double
          type: number
      required:
      - cores
      - iowaitPct
      - load1
      - load15
      - load5
      - systemPct
      - usagePct
      - userPct
      type: object
    NodeDisk:
      additionalProperties: false
      properties:
        availBytes:
          format: int64
          type: integer
        awaitReadMs:
          description: 平均读延迟 = read_time 速率 ÷ reads_completed 速率
          format: double
          type: number
        awaitWriteMs:
          description: 平均写延迟
          format: double
          type: number
        device:
          type: string
        fsType:
          type: string
        inodeUsagePct:
          description: inode 用尽同样会让写入失败，且容量还很空
          format: double
          type: number
        ioUtilPct:
          format: double
          type: number
        mountPoint:
          type: string
        queueDepth:
          description: 平均在途请求数 = io_time_weighted 速率
          format: double
          type: number
        readBytesPerSec:
          format: double
          type: number
        readIOPS:
          format: double
          type: number
        readOnly:
          description: 文件系统被内核改判只读 = 盘出错的强信号
          type: boolean
        totalBytes:
          format: int64
          type: integer
        usagePct:
          format: double
          type: number
        writeBytesPerSec:
          format: double
          type: number
        writeIOPS:
          format: double
          type: number
      required:
      - availBytes
      - awaitReadMs
      - awaitWriteMs
      - device
      - fsType
      - inodeUsagePct
      - ioUtilPct
      - mountPoint
      - queueDepth
      - readBytesPerSec
      - readIOPS
      - readOnly
      - totalBytes
      - usagePct
      - writeBytesPerSec
      - writeIOPS
      type: object
    NodeDiskLevels:
      additionalProperties: false
      description: 单块盘各读数的等级
      properties:
        inode:
          enum:
          - good
          - warn
          - crit
          - unknown
          type: string
        ioUtil:
          enum:
          - good
          - warn
          - crit
          - unknown
          type: string
        usage:
          description: 容量（inode 单独一项；矩阵里的磁盘格取两者更满的一个）
          enum:
          - good
          - warn
          - crit
          - unknown
          type: string
      required:
      - inode
      - ioUtil
      - usage
      type: object
    NodeHardware:
      additionalProperties: false
      description: 风扇 / 散热 / 电压。切片为空表示该节点没有对应传感器。
      properties:
        cooling:
          items:
            $ref: '#/components/schemas/CoolingDevice'
          type: array
        fans:
          items:
            $ref: '#/components/schemas/FanSensor'
          type: array
        undervoltAlarm:
          description: 欠压告警位（树莓派 rpi_volt 的 in0_lcrit_alarm）。nil = 无此传感器。
          nullable: true
          type: boolean
      required:
      - cooling
      - fans
      type: object
    NodeLevels:
      additionalProperties: false
      description: 节点详情各读数的等级（后端判定，前端只按它上色）。 读数所在的采集项没采到时为 unknown。整台节点的结论看硬件矩阵那一行的 overall。
      properties:
        conntrack:
          enum:
          - good
          - warn
          - crit
          - unknown
          type: string
        cpu:
          enum:
          - good
          - warn
          - crit
          - unknown
          type: string
        cpuLoad:
          description: 每核负载（排队等 CPU）
          enum:
          - good
          - warn
          - crit
          - unknown
          type: string
        disks:
          description: 与节点的 disks 一一对应
          items:
            $ref: '#/components/schemas/NodeDiskLevels'
          type: array
        entropy:
          enum:
          - good
          - warn
          - crit
          - unknown
          type: string
        fileFd:
          enum:
          - good
          - warn
          - crit
          - unknown
          type: string
        iowait:
          enum:
          - good
          - warn
          - crit
          - unknown
          type: string
        memory:
          enum:
          - good
          - warn
          - crit
          - unknown
          type: string
        oomKill:
          enum:
          - good
          - warn
          - crit
          - unknown
          type: string
        procsBlocked:
          enum:
          - good
          - warn
          - crit
          - unknown
          type: string
        psi:
          $ref: '#/components/schemas/NodePSILevels'
        swap:
          enum:
          - good
          - warn
          - crit
          - unknown
          type: string
        timeSync:
          enum:
          - good
          - warn
          - crit
          - unknown
          type: string
        vmstat:
          $ref: '#/components/schemas/NodeVMStatLevels'
      required:
      - conntrack
      - cpu
      - cpuLoad
      - disks
      - entropy
      - fileFd
      - iowait
      - memory
      - oomKill
      - procsBlocked
      - psi
      - swap
      - timeSync
      - vmstat
      type: object
    NodeMemory:
      additionalProperties: false
      properties:
        availableBytes:
          format: int64
          type: integer
        buffersBytes:
          format: int64
          type: integer
        cachedBytes:
          format: int64
          type: integer
        freeBytes:
          format: int64
          type: integer
        oomKillTotal:
