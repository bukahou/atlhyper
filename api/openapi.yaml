          description: 主磁盘在 disks 里的下标（根分区所在的盘，否则取最大的已挂载盘）；没有可用的盘为 null
          nullable: true
          type: integer
        psi:
          $ref: '#/components/schemas/NodePSI'
        softnet:
          $ref: '#/components/schemas/NodeSoftnet'
        system:
          $ref: '#/components/schemas/NodeSystem'
        tcp:
          $ref: '#/components/schemas/NodeTCP'
        temperature:
          $ref: '#/components/schemas/NodeTemperature'
        timestamp:
          format: date-time
          type: string
